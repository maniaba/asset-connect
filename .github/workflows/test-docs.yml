name: Test Docs

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/test-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install docs dependencies
        run: pip install -r docs/requirements.txt

      - name: Check docs dependencies
        run: pip check

      - name: Build docs strictly
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/mkdocs-site"
